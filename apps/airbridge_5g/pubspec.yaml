name: airbridge_5g
description: AirBridge 5G — Cross-Platform Network Resilience & Connectivity Utility
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Windows UI
  fluent_ui: ^4.9.0

  # Routing
  go_router: ^14.2.0

  # UI / Theming
  flex_color_scheme: ^7.3.1
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  qr_flutter: ^4.1.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  lucide_icons: ^0.257.0

  # Networking
  dio: ^5.5.0+1
  grpc: ^3.2.4
  protobuf: ^3.1.0
  mobile_scanner: ^5.0.0


  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # i18n
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

  # Platform Utils
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.1

  # Cupertino
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  generate: true
